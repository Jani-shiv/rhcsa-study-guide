name: "Bug Report"
description: "Report a bug, inaccurate command, or broken link in the RHCSA study guide"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue and help improve the RHCSA Study Guide!
  - type: dropdown
    id: category
    attributes:
      label: "Issue Category"
      options:
        - "Technical / Command Error (RHEL 9)"
        - "Typo / Grammar in Chapter Text"
        - "Broken Link / Missing Asset"
        - "UI / Layout / CSS Glitch"
        - "Mobile App / Capacitor Issue"
        - "Other"
    validations:
      required: true
  - type: input
    id: affected-chapter
    attributes:
      label: "Affected Chapter or File"
      placeholder: "e.g., Chapter 4: Manage Systemd Services (chapter4.html)"
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: "Current Behavior / What is incorrect?"
      placeholder: "Describe the error, inaccurate command, or unexpected behavior..."
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected Behavior / Correct RHEL 9 syntax"
      placeholder: "What should the command or content be according to RHEL 9 / RH199 guidelines?"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots or Terminal Logs (optional)"
      placeholder: "Drag and drop images or paste terminal logs here."
  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I have searched existing issues to ensure this is not a duplicate."
          required: true
        - label: "I have confirmed the behavior aligns with RHEL 9.3+."
          required: false
